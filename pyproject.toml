[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-racer-ai-lab"
version = "1.2.0"
description = "Local Python application, simulation, and evolution core for EvoRacer AI Lab"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Efe Erim" }]
requires-python = "==3.13.*"
dependencies = [
  "neat-python==2.0.0",
]

[project.scripts]
evo-racer = "evo_racer.launcher:main"
evo-racer-service = "evo_racer.service:main"

[tool.setuptools]
package-dir = {"" = "python/src"}

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.setuptools.package-data]
evo_racer = ["config/*.ini"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["python/tools"]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100
required-version = "==0.17.3"
src = ["python/src", "python/tests", "python/tools"]
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
