[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evo-racer-ai-lab"
version = "0.1.0"
description = "Local Python application, simulation, and evolution core for EvoRacer AI Lab"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
  "neat-python==2.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[project.scripts]
evo-racer-service = "evo_racer.service:main"

[tool.setuptools]
package-dir = {"" = "python/src"}

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.setuptools.package-data]
evo_racer = ["config/*.ini"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100
required-version = "==0.16.0"
src = ["python/src", "python/tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
