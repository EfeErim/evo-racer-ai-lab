<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">EvoRacer AI Lab results workspace</title>
  <desc id="desc">Dark local application interface showing a stopped Fixed GA run, fitness history, baseline comparison, and champion replay.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171d24"/>
      <stop offset="1" stop-color="#11161c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ea7d8"/>
      <stop offset="1" stop-color="#9ee6c1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="#0d1116"/>
  <rect x="0" y="0" width="1200" height="52" fill="#12171d" stroke="#29313b"/>
  <circle cx="24" cy="26" r="9" fill="none" stroke="#7ea7d8"/>
  <path d="M20 26h8M24 22v8" stroke="#7ea7d8"/>
  <text x="42" y="24" fill="#eef3f7" font-family="Arial, sans-serif" font-size="15" font-weight="700">EvoRacer</text>
  <text x="42" y="39" fill="#7d8996" font-family="Arial, sans-serif" font-size="9">Simulation workspace</text>
  <circle cx="1084" cy="26" r="4" fill="#79d0a7"/>
  <text x="1094" y="30" fill="#aab4bd" font-family="Arial, sans-serif" font-size="11">Offline</text>
  <rect x="0" y="52" width="212" height="623" fill="#11161c" stroke="#29313b"/>
  <text x="20" y="82" fill="#6f7e8c" font-family="Arial, sans-serif" font-size="9" letter-spacing="1.5">EXPERIMENT SETUP</text>
  <g font-family="Arial, sans-serif" font-size="12">
    <text x="22" y="124" fill="#56616c">01  Welcome</text>
    <text x="22" y="160" fill="#56616c">02  Track</text>
    <text x="22" y="196" fill="#56616c">03  Training Settings</text>
    <text x="22" y="232" fill="#56616c">04  Review</text>
    <text x="22" y="268" fill="#83909b">05  Training</text>
    <rect x="12" y="284" width="188" height="38" rx="4" fill="#203043" stroke="#47627e"/>
    <text x="22" y="308" fill="#eef3f7">06  Results</text>
  </g>
  <g transform="translate(236 76)">
    <text x="0" y="0" fill="#7ea7d8" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.2">EXPERIMENT / RESULTS</text>
    <text x="0" y="42" fill="#f5f7fa" font-family="Arial, sans-serif" font-size="34" font-weight="700">Results</text>
    <text x="0" y="70" fill="#9da8b2" font-family="Arial, sans-serif" font-size="13">Python-owned metadata, champion replay, and comparable baselines.</text>
    <rect x="0" y="92" width="932" height="94" rx="7" fill="url(#panel)" stroke="#2c3641"/>
    <text x="18" y="116" fill="#7d8996" font-family="Arial, sans-serif" font-size="9" letter-spacing="1">STOPPED RUN</text>
    <text x="18" y="140" fill="#eef3f7" font-family="Arial, sans-serif" font-size="17" font-weight="700">Easy Oval</text>
    <text x="18" y="160" fill="#8e99a4" font-family="Arial, sans-serif" font-size="10">Fixed GA · seed 42 · local run</text>
    <g font-family="Arial, sans-serif">
      <rect x="250" y="112" width="145" height="52" rx="4" fill="#151b22" stroke="#303a45"/>
      <text x="263" y="131" fill="#788592" font-size="8">CHAMPION FITNESS</text>
      <text x="263" y="151" fill="#edf2f6" font-size="15" font-weight="700">320.052</text>
      <rect x="408" y="112" width="145" height="52" rx="4" fill="#151b22" stroke="#303a45"/>
      <text x="421" y="131" fill="#788592" font-size="8">PROGRESS</text>
      <text x="421" y="151" fill="#edf2f6" font-size="15" font-weight="700">26.7%</text>
      <rect x="566" y="112" width="145" height="52" rx="4" fill="#151b22" stroke="#303a45"/>
      <text x="579" y="131" fill="#788592" font-size="8">GENERATIONS</text>
      <text x="579" y="151" fill="#edf2f6" font-size="15" font-weight="700">3 / 12</text>
      <rect x="724" y="112" width="190" height="52" rx="4" fill="#151b22" stroke="#303a45"/>
      <text x="737" y="131" fill="#788592" font-size="8">RUNTIME</text>
      <text x="737" y="151" fill="#9ee6c1" font-size="15" font-weight="700">Loopback only</text>
    </g>
    <rect x="0" y="202" width="570" height="198" rx="7" fill="url(#panel)" stroke="#2c3641"/>
    <text x="18" y="228" fill="#edf2f6" font-family="Arial, sans-serif" font-size="15" font-weight="700">Fitness history</text>
    <text x="442" y="228" fill="#7ea7d8" font-family="Arial, sans-serif" font-size="9">— Best</text>
    <text x="500" y="228" fill="#7d8996" font-family="Arial, sans-serif" font-size="9">— Median</text>
    <g stroke="#27313b" stroke-width="1">
      <path d="M18 264h534M18 310h534M18 356h534"/>
      <path d="M104 246v132M190 246v132M276 246v132M362 246v132M448 246v132"/>
    </g>
    <polyline points="35,344 280,344 535,270" fill="none" stroke="#8db5e3" stroke-width="3"/>
    <polyline points="35,365 280,365 535,364" fill="none" stroke="#64717d" stroke-width="2"/>
    <rect x="588" y="202" width="344" height="198" rx="7" fill="url(#panel)" stroke="#2c3641"/>
    <text x="606" y="228" fill="#edf2f6" font-family="Arial, sans-serif" font-size="15" font-weight="700">Champion replay</text>
    <path d="M668 296c0-36 29-65 65-65h94c36 0 65 29 65 65s-29 65-65 65h-94c-36 0-65-29-65-65z" fill="none" stroke="#3c4651" stroke-width="24"/>
    <path d="M668 296c0-36 29-65 65-65h94c36 0 65 29 65 65s-29 65-65 65h-94c-36 0-65-29-65-65z" fill="none" stroke="#7d8996" stroke-width="2" stroke-dasharray="7 7"/>
    <circle cx="735" cy="231" r="7" fill="#9ee6c1"/>
    <path d="M735 231l14 4-14 4z" fill="#eef3f7"/>
    <text x="606" y="382" fill="#8e99a4" font-family="Arial, sans-serif" font-size="10">Recorded Python motion · immutable setup</text>
    <rect x="0" y="416" width="932" height="150" rx="7" fill="url(#panel)" stroke="#2c3641"/>
    <text x="18" y="443" fill="#edf2f6" font-family="Arial, sans-serif" font-size="15" font-weight="700">Champion and baselines</text>
    <g font-family="Arial, sans-serif" font-size="10">
      <text x="18" y="472" fill="#74818e">CONTROLLER</text>
      <text x="420" y="472" fill="#74818e">FITNESS</text>
      <text x="560" y="472" fill="#74818e">PROGRESS</text>
      <text x="740" y="472" fill="#74818e">OUTCOME</text>
      <path d="M18 480h896M18 515h896M18 550h896" stroke="#303a45"/>
      <text x="18" y="503" fill="#edf2f6" font-weight="700">Champion</text>
      <text x="420" y="503" fill="#edf2f6">320.052</text>
      <text x="560" y="503" fill="#edf2f6">26.7%</text>
      <text x="740" y="503" fill="#edf2f6">Fixed GA</text>
      <text x="18" y="538" fill="#c2cad1" font-weight="700">Seeded random network</text>
      <text x="420" y="538" fill="#c2cad1">0.000</text>
      <text x="560" y="538" fill="#c2cad1">0.0%</text>
      <text x="740" y="538" fill="#c2cad1">Same vehicle setup</text>
    </g>
  </g>
  <rect x="236" y="640" width="932" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="236" y="661" fill="#71808d" font-family="Arial, sans-serif" font-size="10">Offline Windows x64 · deterministic Python core · observer-only interface</text>
</svg>
